<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productivity | The Sinasera</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="script.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Self-study tool: scoped under #ll-root ── */
    :root {
      --sl-muted: rgba(19,30,33,0.45);
      --sl-border: rgba(19,30,33,0.18);
      --sl-card: rgba(255,255,255,0.72);
      --sl-teal-bg: rgba(0,130,142,0.07);
      --sl-yellow-bg: rgba(255,205,0,0.12);
      --sl-sub-1: #00828E;
      --sl-sub-2: #9c4a34;
      --sl-sub-3: #6a529c;
      --sl-sub-4: #ab8a3c;
      --sl-sub-5: #3c7a86;
      --sl-sub-6: #4f6b52;
    }

    #ll-root {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--p-dark);
      padding: 28px 20px 80px;
    }

    #ll-root .sl-page { max-width: 720px; margin: 0 auto; }

    /* ---- Masthead ---- */
    #ll-root .masthead {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 3px double var(--p-dark);
      padding-bottom: 10px;
      margin-bottom: 4px;
    }
    #ll-root .masthead h1 {
      font-family: 'Source Serif 4', serif;
      font-weight: 700;
      font-size: 26px;
      margin: 0;
      letter-spacing: 0.3px;
    }
    #ll-root .masthead .subtitle {
      font-size: 11px;
      color: var(--sl-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 3px;
    }
    #ll-root .stamp {
      border: 2px solid var(--p-yellow);
      color: var(--p-dark);
      background: var(--sl-yellow-bg);
      border-radius: 50%;
      width: 62px; height: 62px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transform: rotate(-8deg);
      font-family: 'Source Serif 4', serif;
      line-height: 1; flex-shrink: 0;
    }
    #ll-root .stamp .n { font-size: 22px; font-weight: 700; }
    #ll-root .stamp .label { font-size: 7px; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

    /* ---- Sync bar ---- */
    #ll-root .sync-bar {
      display: flex; align-items: center; gap: 10px;
      flex-wrap: wrap; font-size: 10.5px;
      color: var(--sl-muted); margin: 10px 0 16px;
    }
    #ll-root .sync-repo { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 100px; }
    #ll-root .sync-status.ok { color: var(--p-teal); }
    #ll-root .sync-status.err { color: var(--p-red); }
    #ll-root .sl-btn-ghost {
      background: none; border: 1px solid var(--sl-border);
      color: var(--sl-muted); font-size: 10px; padding: 3px 9px;
      cursor: pointer; font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
    }
    #ll-root .sl-btn-ghost:hover { border-color: var(--p-teal); color: var(--p-teal); }
    #ll-root .sync-error-banner {
      border: 1px solid var(--p-red); color: var(--p-red);
      background: rgba(255,25,3,0.06);
      padding: 8px 12px; font-size: 11px; margin-bottom: 14px; line-height: 1.5;
    }

    /* ---- Gate ---- */
    #ll-root .gate-wrap {
      display: flex; align-items: center; justify-content: center;
      min-height: calc(100vh - 120px);
    }
    #ll-root .gate-card {
      border: 1px solid var(--p-dark);
      background: var(--sl-card);
      padding: 26px 24px; max-width: 440px; width: 100%;
    }
    #ll-root .gate-title {
      font-family: 'Source Serif 4', serif;
      font-size: 20px; font-weight: 700; margin-bottom: 4px;
    }
    #ll-root .gate-subtitle {
      font-size: 11px; color: var(--sl-muted);
      margin-bottom: 18px; line-height: 1.6;
    }
    #ll-root .gate-field { margin-bottom: 14px; }
    #ll-root .gate-field label {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 1px; color: var(--sl-muted); display: block; margin-bottom: 4px;
    }
    #ll-root .gate-field input {
      width: 100%; font-family: 'IBM Plex Mono', monospace;
      font-size: 13px; background: transparent;
      border: none; border-bottom: 1px solid var(--p-dark);
      padding: 6px 2px; color: var(--p-dark); box-sizing: border-box;
    }
    #ll-root .gate-field input:focus { outline: none; border-bottom: 2px solid var(--p-teal); }
    #ll-root .gate-error { font-size: 11px; color: var(--p-red); margin: 10px 0; line-height: 1.5; }
    #ll-root .gate-btn {
      width: 100%; margin-top: 8px;
      background: var(--p-dark); color: #fff;
      border: none; padding: 10px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px; text-transform: uppercase;
      letter-spacing: 1.5px; cursor: pointer;
    }
    #ll-root .gate-btn:hover { background: var(--p-teal); }
    #ll-root .gate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ---- Stats ---- */
    #ll-root .stats-row { display: flex; gap: 14px; margin: 18px 0 16px; flex-wrap: wrap; }
    #ll-root .stat {
      flex: 1; min-width: 130px;
      border: 1px solid var(--sl-border);
      padding: 10px 12px; background: var(--sl-card);
    }
    #ll-root .stat .num { font-family: 'Source Serif 4', serif; font-size: 20px; font-weight: 700; color: var(--p-teal); }
    #ll-root .stat .lbl { font-size: 10px; color: var(--sl-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

    /* ---- Breakdown ---- */
    #ll-root .breakdown-card {
      border: 1px solid var(--sl-border);
      background: var(--sl-card);
      padding: 12px 14px 4px; margin-bottom: 22px;
    }
    #ll-root .sl-card-title {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 1.5px; color: var(--sl-muted); margin-bottom: 10px;
    }
    #ll-root .breakdown-row {
      display: grid;
      grid-template-columns: 40% 1fr 56px;
      align-items: center;
      gap: 10px; margin-bottom: 9px; font-size: 11.5px;
    }
    #ll-root .breakdown-name {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #ll-root .breakdown-track {
      height: 6px;
      background: rgba(0,130,142,0.12); position: relative;
    }
    #ll-root .breakdown-fill { height: 100%; }
    #ll-root .breakdown-mins { width: 64px; flex-shrink: 0; text-align: right; color: var(--sl-muted); font-size: 10.5px; }
    #ll-root .breakdown-empty { font-size: 11px; color: var(--sl-muted); padding-bottom: 10px; }

    /* ---- Timer ---- */
    #ll-root .timer-card {
      border: 1px solid var(--sl-border);
      background: var(--sl-teal-bg);
      padding: 16px; margin-bottom: 26px;
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    }
    #ll-root .timer-dial {
      width: 84px; height: 84px; border-radius: 50%;
      border: 2px solid var(--p-teal);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; background: #fff;
    }
    #ll-root .timer-dial.goal-reached { border-color: var(--p-yellow); background: var(--sl-yellow-bg); }
    #ll-root .timer-dial .time { font-family: 'Source Serif 4', serif; font-size: 19px; font-weight: 700; }
    #ll-root .timer-info { flex: 1; min-width: 160px; }
    #ll-root .timer-mode-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--sl-muted); margin-bottom: 4px; }
    #ll-root .timer-sessions { font-size: 11px; color: var(--sl-muted); margin-bottom: 8px; }
    #ll-root .timer-controls { display: flex; gap: 8px; flex-wrap: wrap; }
    #ll-root .timer-btn {
      border: 1px solid var(--sl-border); background: transparent;
      color: var(--p-dark); padding: 6px 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px; text-transform: uppercase;
      letter-spacing: 1px; cursor: pointer;
    }
    #ll-root .timer-btn.primary { background: var(--p-dark); color: #fff; border-color: var(--p-dark); }
    #ll-root .timer-btn.primary:hover { background: var(--p-teal); border-color: var(--p-teal); }
    #ll-root .timer-btn:not(.primary):hover { background: rgba(0,0,0,0.05); }
    #ll-root .timer-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #ll-root .timer-presets { display: flex; gap: 6px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
    #ll-root .timer-presets-label { font-size: 10px; color: var(--sl-muted); text-transform: uppercase; letter-spacing: 1px; margin-right: 2px; }
    #ll-root .preset-btn {
      border: 1px solid var(--sl-border); background: transparent;
      color: var(--sl-muted); padding: 3px 10px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px; cursor: pointer; border-radius: 12px;
    }
    #ll-root .preset-btn:hover { border-color: var(--p-teal); color: var(--p-teal); }
    #ll-root .preset-btn.active { background: var(--p-teal); color: #fff; border-color: var(--p-teal); }

    /* ---- Project board ---- */
    #ll-root .project-board {
      border: 1px solid var(--sl-border);
      background: var(--sl-card);
      padding: 16px; margin-bottom: 26px;
    }
    #ll-root .project-board-header {
      display: flex; justify-content: space-between;
      align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
    }
    #ll-root .sl-section-title {
      font-family: 'Source Serif 4', serif;
      font-size: 15px; text-transform: uppercase;
      letter-spacing: 2px; color: var(--p-dark);
    }
    #ll-root .project-board-add { display: flex; gap: 8px; align-items: center; }
    #ll-root .project-board-add input {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12.5px; background: transparent;
      border: none; border-bottom: 1px solid var(--p-dark);
      padding: 4px 2px; color: var(--p-dark); min-width: 140px;
    }
    #ll-root .project-board-add input:focus { outline: none; border-bottom: 2px solid var(--p-teal); }
    #ll-root .sl-add-btn {
      border: 1px solid var(--p-dark); background: transparent;
      color: var(--p-dark); padding: 4px 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px; text-transform: uppercase;
      letter-spacing: 1px; cursor: pointer;
    }
    #ll-root .sl-add-btn:hover { background: var(--p-dark); color: #fff; }
    #ll-root .sl-add-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #ll-root .kanban-columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 560px) { #ll-root .kanban-columns { grid-template-columns: 1fr; } }
    #ll-root .kanban-column { border-left: 1px solid var(--sl-border); padding-left: 12px; }
    #ll-root .kanban-column:first-child { border-left: none; padding-left: 0; }
    #ll-root .kanban-column-title {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 1.5px; color: var(--sl-muted); margin-bottom: 10px;
    }
    #ll-root .kanban-card {
      display: flex; align-items: center; gap: 8px;
      border: 1px solid var(--sl-border); background: #fff;
      padding: 8px 10px; margin-bottom: 8px;
    }
    #ll-root .kanban-card-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    #ll-root .kanban-card-name { flex: 1; font-size: 12.5px; color: var(--p-dark); word-break: break-word; }
    #ll-root .kanban-card-actions { display: flex; gap: 2px; flex-shrink: 0; }
    #ll-root .kanban-card-actions button {
      background: none; border: none; color: var(--sl-muted);
      font-size: 12px; line-height: 1; cursor: pointer; padding: 2px 4px;
    }
    #ll-root .kanban-card-actions button:hover { color: var(--p-teal); }
    #ll-root .kanban-card-actions button:last-child:hover { color: var(--p-red); }
    #ll-root .kanban-card-actions button:disabled { opacity: 0.25; cursor: not-allowed; }

    /* ---- Daily & Reflection cards ---- */
    #ll-root .daily-card {
      border: 1px solid var(--sl-border);
      background: var(--sl-card);
      padding: 16px; margin-bottom: 26px;
    }
    #ll-root .daily-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 10px;
      flex-wrap: wrap; gap: 8px;
    }
    #ll-root .daily-date-picker { display: flex; align-items: center; gap: 8px; }
    #ll-root .daily-date-picker input[type="date"] {
      font-family: 'IBM Plex Mono', monospace; font-size: 12px;
      border: 1px solid var(--sl-border); background: transparent;
      padding: 4px 6px; color: var(--p-dark);
    }
    #ll-root .sl-link-btn {
      background: none; border: none; color: var(--sl-muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px; letter-spacing: 0.5px; cursor: pointer; padding: 2px 0;
      text-decoration: underline; text-underline-offset: 2px;
    }
    #ll-root .sl-link-btn:hover { color: var(--p-teal); }

    /* Date nav arrows */
    #ll-root .date-nav {
      display: flex; align-items: center; gap: 6px;
    }
    #ll-root .date-nav-btn {
      border: 1px solid var(--sl-border); background: transparent;
      color: var(--p-dark); width: 26px; height: 26px;
      font-size: 15px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #ll-root .date-nav-btn:hover { border-color: var(--p-teal); color: var(--p-teal); }
    #ll-root .date-nav-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px; color: var(--p-dark); min-width: 90px; text-align: center;
    }

    #ll-root .highlight-list { margin-bottom: 12px; }
    #ll-root .highlight-item { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    #ll-root .highlight-item input[type="checkbox"] {
      width: 16px; height: 16px; accent-color: var(--p-teal);
      flex-shrink: 0; cursor: pointer;
    }
    #ll-root .highlight-item input[type="text"] {
      flex: 1; font-family: 'IBM Plex Mono', monospace; font-size: 13px;
      background: transparent; border: none;
      border-bottom: 1px solid var(--sl-border);
      padding: 4px 2px; color: var(--p-dark);
    }
    #ll-root .highlight-item input[type="text"]:focus { outline: none; border-bottom: 2px solid var(--p-teal); }
    #ll-root .highlight-item.done input[type="text"] { text-decoration: line-through; color: var(--sl-muted); }
    #ll-root .highlight-remove-btn {
      background: none; border: none; color: var(--sl-muted);
      font-size: 15px; line-height: 1; cursor: pointer; flex-shrink: 0; padding: 0 2px;
    }
    #ll-root .highlight-remove-btn:hover { color: var(--p-red); }
    #ll-root .highlight-add-btn {
      border: 1px dashed var(--sl-border); background: transparent;
      color: var(--sl-muted); padding: 5px 12px;
      font-family: 'IBM Plex Mono', monospace; font-size: 11px;
      letter-spacing: 0.5px; cursor: pointer;
    }
    #ll-root .highlight-add-btn:hover { border-color: var(--p-teal); color: var(--p-teal); border-style: solid; }

    #ll-root .reflection-textarea {
      width: 100%; font-family: 'IBM Plex Mono', monospace;
      font-size: 13px; background: transparent;
      border: 1px solid var(--sl-border);
      padding: 8px; min-height: 90px; color: var(--p-dark);
      resize: vertical; box-sizing: border-box;
    }
    #ll-root .reflection-textarea:focus { outline: none; border-color: var(--p-teal); }

    #ll-root .daily-save-row {
      display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap;
    }
    #ll-root .daily-save-status { font-size: 10.5px; }
    #ll-root .daily-save-status.dirty { color: var(--p-red); }
    #ll-root .daily-save-status.saved { color: var(--p-teal); }
    #ll-root .reflection-date-label { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--sl-muted); }

    /* ---- Entry form ---- */
    #ll-root form.entry {
      border: 1px solid var(--sl-border);
      padding: 16px; margin-bottom: 26px; background: var(--sl-card);
    }
    #ll-root form.entry .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    #ll-root form.entry label {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 1px; color: var(--sl-muted); display: block; margin-bottom: 4px;
    }
    #ll-root form.entry input, #ll-root form.entry select, #ll-root form.entry textarea {
      width: 100%; font-family: 'IBM Plex Mono', monospace;
      font-size: 13px; background: transparent;
      border: none; border-bottom: 1px solid var(--p-dark);
      padding: 5px 2px; color: var(--p-dark);
    }
    #ll-root form.entry select { cursor: pointer; }
    #ll-root form.entry input:focus, #ll-root form.entry select:focus, #ll-root form.entry textarea:focus {
      outline: none; border-bottom: 2px solid var(--p-teal);
    }
    #ll-root form.entry .col { flex: 1; min-width: 130px; }
    #ll-root form.entry textarea { resize: vertical; min-height: 40px; }
    #ll-root .rating-hint { font-size: 10.5px; color: var(--sl-muted); margin-top: 4px; font-style: italic; }

    #ll-root .submit-btn {
      margin-top: 6px; background: var(--p-dark); color: #fff;
      border: none; padding: 9px 18px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px; text-transform: uppercase;
      letter-spacing: 1.5px; cursor: pointer;
    }
    #ll-root .submit-btn:hover { background: var(--p-teal); }
    #ll-root .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ---- Log card ---- */
    #ll-root .log-card {
      border: 1px solid var(--sl-border);
      background: var(--sl-card);
      padding: 16px; margin-bottom: 26px;
    }
    #ll-root .log-heading-row {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--sl-border);
      padding-bottom: 6px; margin-bottom: 14px; gap: 10px; flex-wrap: wrap;
    }
    #ll-root .log-heading-actions { display: flex; gap: 10px; align-items: center; }
    #ll-root .filter-select {
      font-family: 'IBM Plex Mono', monospace; font-size: 10.5px;
      background: transparent; border: 1px solid var(--sl-border);
      color: var(--sl-muted); padding: 4px 6px; cursor: pointer;
    }
    #ll-root .export-btn {
      background: none; border: 1px solid var(--sl-border);
      color: var(--sl-muted); font-size: 10px; padding: 4px 10px;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; font-family: 'IBM Plex Mono', monospace;
    }
    #ll-root .export-btn:hover { border-color: var(--p-teal); color: var(--p-teal); }
    #ll-root .export-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #ll-root .log-table-header {
      display: grid;
      grid-template-columns: 56px 84px 84px 52px 60px minmax(0,1fr) 30px;
      gap: 10px; align-items: center;
      padding: 0 0 6px;
      font-size: 9.5px; text-transform: uppercase;
      letter-spacing: 1px; color: var(--sl-muted);
      border-bottom: 1px solid var(--sl-border);
    }
    #ll-root .entry-row {
      display: grid;
      grid-template-columns: 56px 84px 84px 52px 60px minmax(0,1fr) 30px;
      gap: 10px; align-items: start;
      padding: 10px 0;
      border-bottom: 1px dashed var(--sl-border);
    }
    @media (max-width: 520px) {
      #ll-root .log-table-header, #ll-root .entry-row {
        grid-template-columns: 48px 70px 44px 54px minmax(0,1fr) 24px;
      }
      #ll-root .log-table-header > *:nth-child(3),
      #ll-root .entry-row .entry-subtopic { display: none; }
    }
    #ll-root .entry-date {
      font-family: 'Source Serif 4', serif;
      font-weight: 700; font-size: 12.5px;
      color: var(--p-teal); padding-top: 1px;
    }
    #ll-root .entry-topic {
      font-size: 11.5px; font-weight: 600;
      display: inline-block; color: #fff;
      padding: 2px 7px; line-height: 1.4;
    }
    #ll-root .entry-subtopic {
      font-size: 10.5px; color: var(--sl-muted);
      padding-top: 3px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    #ll-root .entry-minutes { font-size: 11px; color: var(--sl-muted); padding-top: 3px; text-align: right; white-space: nowrap; }
    #ll-root .entry-rating-short { font-size: 10.5px; color: var(--p-teal); padding-top: 3px; white-space: nowrap; }
    #ll-root .entry-note { font-size: 12px; color: var(--p-dark); line-height: 1.5; padding-top: 2px; word-break: break-word; }
    #ll-root .del-btn {
      background: none; border: none; color: var(--sl-muted);
      font-size: 10px; cursor: pointer; text-decoration: underline;
      padding: 0; padding-top: 3px; justify-self: end;
    }
    #ll-root .del-btn:hover { color: var(--p-red); }
    #ll-root .empty-state { text-align: center; padding: 30px 10px; color: var(--sl-muted); font-size: 12px; line-height: 1.8; }
    #ll-root .footer-note { text-align: center; font-size: 10px; color: var(--sl-muted); margin-top: 30px; letter-spacing: 1px; }

    /* ---- Confirm delete modal ---- */
    #ll-root .modal-backdrop {
      position: fixed; inset: 0; z-index: 400;
      background: rgba(19,30,33,0.5);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    #ll-root .modal-card {
      background: #fff; border: 2px solid var(--p-dark);
      padding: 24px; max-width: 360px; width: 100%;
    }

const { useState, useEffect, useMemo, useRef } = React;

const CONFIG_KEY = 'sl-github-config-v1';

const KANBAN_STATUSES = ['not_started', 'in_progress', 'done'];
const KANBAN_COLUMN_LABELS = { not_started: 'NOT STARTED', in_progress: 'IN PROGRESS', done: 'DONE' };

const RATING_OPTIONS = [
  { value: 1, label: '1 — 還很生疏，幾乎要重學' },
  { value: 2, label: '2 — 有點印象，但不熟練' },

  { value: 5, label: '5 — 已內化，不假思索' },
];

const PROJECT_PALETTE = ['#00828E','#9c4a34','#6a529c','#ab8a3c','#3c7a86','#4f6b52'];
function colorForProject(name) {
  let hash = 0;
  const s = String(name || '');
  for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
  return PROJECT_PALETTE[hash % PROJECT_PALETTE.length];
}

function todayStr(d) {
  const t = d || new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}

function offsetDate(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return todayStr(d);
}

function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return `${d.getMonth()+1}/${d.getDate()} (${'日一二三四五六'[d.getDay()]})`;
}

function calcStreak(entries) {
  const dates = new Set(entries.map(e => e.date));
  let streak = 0, cursor = new Date();
  while (true) {
    const iso = todayStr(cursor);
    if (dates.has(iso)) { streak++; cursor.setDate(cursor.getDate() - 1); }
    else break;
  }
  return streak;
}

function last7DaysMinutes(entries) {
  const start = new Date(); start.setDate(start.getDate() - 6); start.setHours(0,0,0,0);
  return entries.filter(e => new Date(e.date+'T00:00:00') >= start).reduce((s,e) => s+Number(e.minutes||0), 0);
}

function last7DaysProjectBreakdown(entries) {
  const start = new Date(); start.setDate(start.getDate() - 6); start.setHours(0,0,0,0);
  const recent = entries.filter(e => new Date(e.date+'T00:00:00') >= start);
  const map = new Map();
  recent.forEach(e => { const k = e.project||'未分類'; map.set(k,(map.get(k)||0)+Number(e.minutes||0)); });
  return [...map.entries()].map(([project,minutes])=>({project,minutes})).sort((a,b)=>b.minutes-a.minutes);
}

function pad2(n) { return String(n).padStart(2,'0'); }
function daysInMonth(y,m) { return new Date(y,m+1,0).getDate(); }
function firstWeekday(y,m) { return new Date(y,m,1).getDay(); }
function ymdStr(y,m,d) { return `${y}-${pad2(m+1)}-${pad2(d)}`; }
function monthLabel(y,m) { return `${y} 年 ${m+1} 月`; }
function formatHM(totalMin) {
  const m = Math.round(Number(totalMin)||0), h = Math.floor(m/60), rem = m%60;
  return h > 0 ? `${h} 時 ${rem} 分` : `${rem} 分`;
}
function mmss(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function csvEscape(val) {
  const s = String(val??'');
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}

function downloadCSV(entries) {
  const lines = [['date','project','subtopic','minutes','rating','note'].join(',')];
  entries.forEach(e => lines.push([e.date,e.project,e.subtopic||'',e.minutes,e.rating,e.note||''].map(csvEscape).join(',')));
  const blob = new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'),{href:url,download:`learning-log-${todayStr()}.csv`});
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ── Base64/UTF-8 ──
function utf8ToB64(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64ToUtf8(b64) { return decodeURIComponent(escape(atob(b64))); }

// ── GitHub API ──
const GH = 'https://api.github.com';
// Encode path segments individually so '/' is not percent-encoded
function encodePath(p) { return p.split('/').map(encodeURIComponent).join('/'); }

async function ghGetFile(token, owner, repo, path) {
  const res = await fetch(`${GH}/repos/${owner}/${repo}/contents/${encodePath(path)}`, {
    headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' }
  });
  if (res.status === 404) return { content: null, sha: null };
  if (!res.ok) throw new Error(`GitHub 讀取失敗（${res.status}）`);
  const data = await res.json();
  return { content: b64ToUtf8((data.content||'').replace(/\n/g,'')), sha: data.sha };
}

async function ghSaveFile(token, owner, repo, path, content, message) {
  let sha = null;
  try { const cur = await ghGetFile(token,owner,repo,path); sha = cur.sha; } catch(e){}
  const body = { message, content: utf8ToB64(content) };
  if (sha) body.sha = sha;
  const res = await fetch(`${GH}/repos/${owner}/${repo}/contents/${encodePath(path)}`, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) { const t = await res.text().catch(()=>''); throw new Error(`GitHub 寫入失敗（${res.status}）${t?': '+t.slice(0,200):''}`); }
  return (await res.json()).content.sha;
}

// ── CSV <-> entries ──
function parseCSVRows(text) {
  const rows=[]; let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){ if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQ=false;}else field+=c; }
    else{ if(c==='"')inQ=true; else if(c===','){row.push(field);field='';}
      else if(c==='\r'){}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
      else field+=c; }
  }
  if(field.length>0||row.length>0){row.push(field);rows.push(row);}
  return rows.filter(r=>!(r.length===1&&r[0]===''));
}

function entriesToCSV(entries) {
  const lines=[['id','date','project','subtopic','minutes','rating','note'].join(',')];
  entries.forEach(e=>lines.push([e.id,e.date,e.project,e.subtopic||'',e.minutes,e.rating,e.note||''].map(csvEscape).join(',')));
  return lines.join('\n');
}

function csvToEntries(text) {
  if(!text||!text.trim()) return [];
  const rows=parseCSVRows(text.trim());
  if(rows.length<2) return [];
  const header=rows[0].map(h=>h.trim().toLowerCase());
  const pCol=header.indexOf('project')!==-1?header.indexOf('project'):header.indexOf('subject');
  return rows.slice(1).map(r=>({
    id:r[0]||(Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
    date:r[1]||todayStr(),
    project:r[pCol]||'',
    subtopic:r[3]||'',
    minutes:Number(r[4])||0,
    rating:Number(r[5])||3,
    note:r[6]||''
  })).filter(e=>e.id&&e.date);
}

// ── Stopwatch ──
const SW_PRESETS=[15,25,45,60];
function StudyStopwatch({onBank}){
  const [secs,setSecs]=useState(0);
  const [run,setRun]=useState(false);
  const [target,setTarget]=useState(null);
  const ref=useRef(null);
  useEffect(()=>{
    if(run){ref.current=setInterval(()=>setSecs(s=>s+1),1000);}
    return ()=>clearInterval(ref.current);
  },[run]);
  const bank=()=>{const m=Math.floor(secs/60);if(m>0)onBank(m);setRun(false);setSecs(0);};
  const reached=target!==null&&secs>=target*60;
  return(
    <div className="timer-card">
      <div className={`timer-dial${reached?' goal-reached':''}`}>
        <div className="time">{mmss(secs)}</div>
      </div>
      <div className="timer-info">
        <div className="timer-mode-label">
          {target===null?'正計時中':reached?`已達成 ${target} 分鐘目標！`:`目標 ${target} 分鐘`}
        </div>
        <div className="timer-sessions">已累積 {Math.floor(secs/60)} 分 {secs%60} 秒</div>
        <div className="timer-controls">
          <button className="timer-btn primary" onClick={()=>setRun(r=>!r)}>{run?'暫停':'開始'}</button>
          <button className="timer-btn" onClick={()=>{setRun(false);setSecs(0);}}>重置</button>
          <button className="timer-btn" onClick={bank} disabled={secs<60}>帶入打卡表單 →</button>
        </div>
        <div className="timer-presets">
          <span className="timer-presets-label">目標時長</span>
          {SW_PRESETS.map(m=>(
            <button key={m} type="button" className={`preset-btn${target===m?' active':''}`}
              onClick={()=>setTarget(p=>p===m?null:m)}>{m} 分</button>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Setup screen ──
function SetupScreen({onSubmit,error,loading}){

// ── Main App ──
function App(){
  const [stage,setStage]=useState('loading');
  const [config,setConfig]=useState(null);
  const [token,setToken]=useState(null);
  const [gateError,setGateError]=useState('');
  const [gateLoading,setGateLoading]=useState(false);

  const [entries,setEntries]=useState([]);
  const [projects,setProjects]=useState(DEFAULT_PROJECTS);
  const [syncing,setSyncing]=useState(false);
  const [syncError,setSyncError]=useState('');
  const [newProject,setNewProject]=useState('');
  const [confirmEntry,setConfirmEntry]=useState(null);

  const [dailyData,setDailyData]=useState({});
  const [selDate,setSelDate]=useState(todayStr());
  const [draftHL,setDraftHL]=useState([]);
  const [draftRef,setDraftRef]=useState('');
  const [savedSnap,setSavedSnap]=useState({highlights:[],reflection:''});
  const [hlSaving,setHlSaving]=useState(false);
  const [hlErr,setHlErr]=useState('');
  const [refSaving,setRefSaving]=useState(false);
  const [refErr,setRefErr]=useState('');
  const [filterProject,setFilterProject]=useState('__all__');

  const [calCursor,setCalCursor]=useState(()=>{const d=new Date();return{year:d.getFullYear(),month:d.getMonth()};});
  const [date,setDate]=useState(todayStr());
  const [project,setProject]=useState('');
  const [subtopic,setSubtopic]=useState('');
  const [minutes,setMinutes]=useState('0');
  const [note,setNote]=useState('');
  const [rating,setRating]=useState(3);

  useEffect(()=>{
    const raw=localStorage.getItem(CONFIG_KEY);
    if(raw){
      try{
        const cfg=JSON.parse(raw);
        if(cfg&&cfg.token){
          cfg.owner=cfg.owner||REPO_OWNER;
          cfg.repo=cfg.repo||REPO_NAME;
          cfg.entriesPath=cfg.entriesPath||ENTRIES_PATH;
          cfg.projectsPath=cfg.projectsPath||PROJECTS_PATH;
          cfg.dailyPath=cfg.dailyPath||DAILY_PATH;
          setConfig(cfg);setToken(cfg.token);setStage('ready');
          loadData(cfg.token,cfg);return;
        }
      }catch(e){}
    }
    setStage('setup');
  },[]);

  useEffect(()=>{
    const entry=dailyData[selDate];
    const hl=entry&&Array.isArray(entry.highlights)?entry.highlights:[];
    const ref=entry&&typeof entry.reflection==='string'?entry.reflection:'';
    setDraftHL(hl);setDraftRef(ref);setSavedSnap({highlights:hl,reflection:ref});
    setHlErr('');setRefErr('');
  },[selDate,dailyData]);

  const loadData=async(tok,cfg)=>{
    setSyncing(true);setSyncError('');
    try{
      const[eRes,pRes,dRes]=await Promise.all([
        ghGetFile(tok,cfg.owner,cfg.repo,cfg.entriesPath),
        ghGetFile(tok,cfg.owner,cfg.repo,cfg.projectsPath),
        ghGetFile(tok,cfg.owner,cfg.repo,cfg.dailyPath),
      ]);
      const loaded=eRes.content?csvToEntries(eRes.content):[];
      setEntries(loaded.sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)));
      let dd={};
      if(dRes.content){try{const p=JSON.parse(dRes.content);if(p&&typeof p==='object')dd=p;}catch(e){}}
      setDailyData(dd);
      let lp=DEFAULT_PROJECTS;
      if(pRes.content){
        try{
          const p=JSON.parse(pRes.content);
          if(Array.isArray(p)&&p.length>0){
            lp=p.map(x=>typeof x==='string'?{name:x,status:'not_started'}:{name:x.name,status:x.status||'not_started'});
          }
        }catch(e){}
      }
      setProjects(lp);
      setProject(prev=>prev||lp[0]?.name||'');
    }catch(e){console.error(e);setSyncError('讀取 GitHub 資料失敗：'+e.message);}
    setSyncing(false);
  };

  const handleSetup=async(rawTok)=>{
    setGateError('');
    if(!rawTok?.trim()){setGateError('請輸入 GitHub Token。');return;}
    setGateLoading(true);
    try{
      const cfg={token:rawTok.trim(),owner:REPO_OWNER,repo:REPO_NAME,
        entriesPath:ENTRIES_PATH,projectsPath:PROJECTS_PATH,dailyPath:DAILY_PATH};
      localStorage.setItem(CONFIG_KEY,JSON.stringify(cfg));
      setConfig(cfg);setToken(cfg.token);setStage('ready');
      await loadData(cfg.token,cfg);
    }catch(e){console.error(e);setGateError('連接失敗，請確認 Token 後再試。');}
    setGateLoading(false);
  };

  const handleDisconnect=()=>{
    localStorage.removeItem(CONFIG_KEY);
    setConfig(null);setToken(null);setEntries([]);setProjects(DEFAULT_PROJECTS);
    setDailyData({});setSelDate(todayStr());setGateError('');setStage('setup');
  };

  const persistEntries=async(next)=>{
    setEntries(next);setSyncing(true);setSyncError('');
    try{await ghSaveFile(token,config.owner,config.repo,config.entriesPath,entriesToCSV(next),`learning-log update ${todayStr()}`);}
    catch(e){console.error(e);setSyncError('同步失敗：'+e.message);}
    setSyncing(false);
  };

  const persistProjects=async(next)=>{
    setProjects(next);setSyncing(true);setSyncError('');
    try{await ghSaveFile(token,config.owner,config.repo,config.projectsPath,JSON.stringify(next,null,2),'更新專案清單');}
    catch(e){console.error(e);setSyncError('同步專案失敗：'+e.message);}
    setSyncing(false);
  };

  const addProject=()=>{
    const name=newProject.trim();
    if(!name||projects.some(p=>p.name===name))return;
    persistProjects([...projects,{name,status:'not_started'}]);
    setNewProject('');if(!project)setProject(name);
  };

  const moveProject=(name,dir)=>{
    persistProjects(projects.map(p=>{
      if(p.name!==name)return p;
      const idx=KANBAN_STATUSES.indexOf(p.status||'not_started');
      const ni=idx+dir;
      return(ni<0||ni>=KANBAN_STATUSES.length)?p:{...p,status:KANBAN_STATUSES[ni]};
    }));
  };

  const removeProject=(name)=>{
    const next=projects.filter(p=>p.name!==name);
    persistProjects(next);
    if(project===name)setProject(next[0]?.name||'');
    if(filterProject===name)setFilterProject('__all__');
  };

  const saveDailyData=async(nextDD,commitMsg)=>{
    try{
      await ghSaveFile(token,config.owner,config.repo,config.dailyPath,JSON.stringify(nextDD,null,2),commitMsg);
      setDailyData(nextDD);
    }catch(e){throw e;}
  };

  const autosaveHL=async(nextHL)=>{
    setHlSaving(true);setHlErr('');
    const cleaned=nextHL.filter(h=>h.text.trim()!=='');
    const existRef=(dailyData[selDate]&&dailyData[selDate].reflection)||'';
    const next={...dailyData,[selDate]:{highlights:cleaned,reflection:existRef,updatedAt:new Date().toISOString()}};
    try{await saveDailyData(next,`更新 Daily Highlight - ${selDate}`);}
    catch(e){console.error(e);setHlErr('自動儲存失敗：'+e.message);}
    setHlSaving(false);
  };

  const addHL=()=>setDraftHL(prev=>[...prev,{id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),text:'',done:false}]);
  const updateHLText=(id,text)=>setDraftHL(prev=>prev.map(h=>h.id===id?{...h,text}:h));
  const handleHLBlur=()=>autosaveHL(draftHL);
  const toggleHLDone=(id)=>setDraftHL(prev=>{const next=prev.map(h=>h.id===id?{...h,done:!h.done}:h);autosaveHL(next);return next;});
  const removeHL=(id)=>setDraftHL(prev=>{const next=prev.filter(h=>h.id!==id);autosaveHL(next);return next;});

  const isRefDirty=draftRef!==savedSnap.reflection;
  const saveRef=async()=>{
    setRefSaving(true);setRefErr('');
    const existHL=(dailyData[selDate]&&dailyData[selDate].highlights)||draftHL.filter(h=>h.text.trim()!=='');
    const next={...dailyData,[selDate]:{highlights:existHL,reflection:draftRef,updatedAt:new Date().toISOString()}};
    try{await saveDailyData(next,`更新每日反思 - ${selDate}`);}
    catch(e){console.error(e);setRefErr('儲存反思失敗：'+e.message);}
    setRefSaving(false);
  };

  const addEntry=async(e)=>{
    e.preventDefault();
    if(!minutes||Number(minutes)<=0||!project)return;
    const ne={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      date,project,subtopic:subtopic.trim(),minutes:Number(minutes),note,rating};
    const next=[ne,...entries].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
    await persistEntries(next);
    setNote('');setSubtopic('');setMinutes('0');setRating(3);setFilterProject('__all__');
  };

  const confirmRemoveEntry=()=>{
    if(!confirmEntry)return;
    persistEntries(entries.filter(e=>e.id!==confirmEntry.id));
    setConfirmEntry(null);
  };

  const streak=useMemo(()=>calcStreak(entries),[entries]);
  const todayDateStr=todayStr();
  const todaysEntries=useMemo(()=>entries.filter(e=>e.date===todayDateStr),[entries,todayDateStr]);
  const todaysMins=useMemo(()=>todaysEntries.reduce((s,e)=>s+Number(e.minutes||0),0),[todaysEntries]);
  const last7=useMemo(()=>last7DaysMinutes(entries),[entries]);
  const last7BD=useMemo(()=>last7DaysProjectBreakdown(entries),[entries]);
  const maxBD=last7BD.length?last7BD[0].minutes:0;

  const calCells=useMemo(()=>{
    const{year,month}=calCursor;
    const cells=[];
    for(let i=0;i<firstWeekday(year,month);i++)cells.push(null);
    for(let d=1;d<=daysInMonth(year,month);d++){
      const ds=ymdStr(year,month,d);
      const ec=entries.filter(e=>e.date===ds).length;
      const dd=dailyData[ds];
      cells.push({dateStr:ds,day:d,entryCount:ec,
        hasHL:!!(dd&&Array.isArray(dd.highlights)&&dd.highlights.some(h=>h.text?.trim())),
        hasRef:!!(dd&&typeof dd.reflection==='string'&&dd.reflection.trim())
      });
    }
    return cells;
  },[calCursor,entries,dailyData]);

  const selDayEntries=useMemo(()=>entries.filter(e=>e.date===selDate),[entries,selDate]);
  const selDayData=dailyData[selDate];

  const visEntries=useMemo(()=>filterProject==='__all__'?entries:entries.filter(e=>e.project===filterProject),[entries,filterProject]);

  const shiftDate=(days)=>{
    const d=new Date(selDate+'T00:00:00');
    d.setDate(d.getDate()+days);
    const next=todayStr(d);
    if(next<=todayStr())setSelDate(next);
  };

  if(stage==='loading') return <div style={{padding:40,fontFamily:'monospace',color:'#666'}}>載入中…</div>;
  if(stage==='setup') return <SetupScreen onSubmit={handleSetup} error={gateError} loading={gateLoading}/>;

  return(
    <div className="sl-page">
      {confirmEntry&&(
        <ConfirmDeleteModal
          entry={confirmEntry}
          onConfirm={confirmRemoveEntry}
          onCancel={()=>setConfirmEntry(null)}
        />
      )}

      <div className="masthead">
        <div>
          <h1>自學紀錄工具</h1>
          <div className="subtitle">Self-Study Log</div>
        </div>
        <div className="stamp">
          <div className="n">{streak}</div>
          <div className="label">Day Streak</div>
        </div>
      </div>

      <div className="sync-bar">
        <span className="sync-repo">🔗 {config.owner}/{config.repo}</span>
        <span className={`sync-status ${syncing?'':(syncError?'err':'ok')}`}>
          {syncing?'同步中…':(syncError?'同步失敗':'已同步')}
        </span>
        <button className="sl-btn-ghost" onClick={()=>loadData(token,config)} disabled={syncing}>重新整理</button>
        <button className="sl-btn-ghost" onClick={handleDisconnect}>登出</button>
      </div>
      {syncError&&<div className="sync-error-banner">{syncError}</div>}

      <div className="stats-row">
        <div className="stat"><div className="num">{todaysEntries.length}</div><div className="lbl">今日紀錄數</div></div>
        <div className="stat"><div className="num">{formatHM(todaysMins)}</div><div className="lbl">今日累積時數</div></div>
        <div className="stat"><div className="num">{formatHM(last7)}</div><div className="lbl">近 7 天時間</div></div>
      </div>

      <div className="breakdown-card">
        <div className="sl-card-title">近七天依專案累計</div>
        {last7BD.length===0?<div className="breakdown-empty">還沒有資料。</div>:
          last7BD.map(b=>(
            <div className="breakdown-row" key={b.project}>
              <div className="breakdown-name">{b.project}</div>
              <div className="breakdown-track">
                <div className="breakdown-fill" style={{width:`${maxBD?(b.minutes/maxBD)*100:0}%`,background:colorForProject(b.project)}}/>
              </div>
              <div className="breakdown-mins">{b.minutes} 分</div>
            </div>
          ))
        }
      </div>

      <div className="project-board">
        <div className="project-board-header">
          <div className="sl-section-title">專案看板</div>
          <div className="project-board-add">
            <input placeholder="新增專案…" value={newProject}
              onChange={e=>setNewProject(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addProject();}}}/>
            <button className="sl-add-btn" type="button" onClick={addProject} disabled={!newProject.trim()}>新增</button>
          </div>
        </div>
        {projects.length===0?<div className="breakdown-empty">還沒有專案，上面新增一個開始吧。</div>:
          <div className="kanban-columns">
            {KANBAN_STATUSES.map(status=>(
              <div className="kanban-column" key={status}>
                <div className="kanban-column-title">{KANBAN_COLUMN_LABELS[status]}</div>
                {projects.filter(p=>(p.status||'not_started')===status).map(p=>{
                  const idx=KANBAN_STATUSES.indexOf(p.status||'not_started');
                  return(
                    <div className="kanban-card" key={p.name}>
                      <span className="kanban-card-dot" style={{background:colorForProject(p.name)}}/>
                      <span className="kanban-card-name">{p.name}</span>
                      <div className="kanban-card-actions">
                        <button type="button" onClick={()=>moveProject(p.name,-1)} disabled={idx<=0} aria-label="移到前一欄">‹</button>
                        <button type="button" onClick={()=>moveProject(p.name,1)} disabled={idx>=KANBAN_STATUSES.length-1} aria-label="移到下一欄">›</button>
                        <button type="button" onClick={()=>removeProject(p.name)} aria-label={`刪除 ${p.name}`}>×</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        }
      </div>

      <div className="daily-card">
        <div className="daily-header">
          <div className="sl-section-title">Daily Highlight</div>
          <div className="date-nav">
            <button type="button" className="date-nav-btn" onClick={()=>shiftDate(-1)}>‹</button>
            <span className="date-nav-label">{fmtDate(selDate)}</span>
            <button type="button" className="date-nav-btn" onClick={()=>shiftDate(1)} disabled={selDate>=todayStr()}>›</button>
            {selDate!==todayStr()&&<button type="button" className="sl-link-btn" onClick={()=>setSelDate(todayStr())}>今天</button>}
          </div>
        </div>

        <div className="highlight-list">
          {draftHL.length===0&&<div className="rating-hint">還沒有項目，點「＋ 新增項目」開始。</div>}
          {draftHL.map(h=>(
            <div className={`highlight-item${h.done?' done':''}`} key={h.id}>
              <input type="checkbox" checked={h.done} onChange={()=>toggleHLDone(h.id)}/>
              <input type="text" value={h.text} onChange={e=>updateHLText(h.id,e.target.value)}
                onBlur={handleHLBlur} placeholder="輸入重點 / to-do…"/>
              <button type="button" className="highlight-remove-btn" onClick={()=>removeHL(h.id)} aria-label="刪除項目">×</button>
            </div>
          ))}
          <button type="button" className="highlight-add-btn" onClick={addHL}>＋ 新增項目</button>
        </div>
        <div className="daily-save-row">
          <span className={`daily-save-status${hlSaving?'':(hlErr?' dirty':' saved')}`}>
            {hlSaving?'自動儲存中…':(hlErr?'自動儲存失敗':'已自動儲存')}
          </span>
        </div>
        {hlErr&&<div className="sync-error-banner">{hlErr}</div>}
      </div>

      <StudyStopwatch onBank={m=>setMinutes(prev=>String((Number(prev)||0)+m))}/>

      <form className="entry" onSubmit={addEntry}>
        <div className="row">
          <div className="col">
            <label>日期</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} max={todayStr()} required/>
          </div>
          <div className="col">
            <label>專案</label>
            {projects.length===0?<div className="rating-hint">請先新增專案</div>:
              <select value={project} onChange={e=>setProject(e.target.value)}>
                {projects.map(p=><option key={p.name} value={p.name}>{p.name}</option>)}
              </select>
            }
          </div>
          <div className="col" style={{maxWidth:100}}>
            <label>分鐘</label>
            <input type="number" min="1" value={minutes} onChange={e=>setMinutes(e.target.value)} required/>
          </div>
        </div>
        <div className="row">
          <div className="col">
            <label>細項主題（選填）</label>
            <input placeholder="例：發音、戰術分析…" value={subtopic} onChange={e=>setSubtopic(e.target.value)}/>
          </div>
        </div>
        <div className="row">
          <div className="col">
            <label>今天學到 / 練了什麼</label>
            <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="例：搞懂越位規則、複習荷蘭文動詞變化…"/>
          </div>
        </div>
        <div className="row">
          <div className="col">
            <label>掌握度自評</label>
            <select value={rating} onChange={e=>setRating(Number(e.target.value))}>
              {RATING_OPTIONS.map(r=><option key={r.value} value={r.value}>{r.label}</option>)}
            </select>
          </div>
        </div>
        <button className="submit-btn" type="submit" disabled={syncing||projects.length===0}>
          {syncing?'同步中…':'蓋章打卡'}
        </button>
      </form>

      <div className="log-card">
        <div className="log-heading-row">
          <div className="sl-section-title">紀錄</div>
          <div className="log-heading-actions">
            <select className="filter-select" value={filterProject} onChange={e=>setFilterProject(e.target.value)}>
              <option value="__all__">全部專案</option>
              {projects.map(p=><option key={p.name} value={p.name}>{p.name}</option>)}
            </select>
            <button className="export-btn" onClick={()=>downloadCSV(visEntries)} disabled={visEntries.length===0}>匯出 CSV</button>
          </div>
        </div>
        {visEntries.length===0?(
          <div className="empty-state">
            {entries.length===0
              ?<React.Fragment>還沒有紀錄。<br/>今天學了什麼，寫下來蓋第一個章吧。</React.Fragment>
              :'這個專案目前沒有紀錄。'}
          </div>
        ):(
          <React.Fragment>
            <div className="log-table-header">
              <span>日期</span><span>專案</span><span>細項</span>
              <span>時長</span><span>掌握度</span><span>學到什麼</span><span></span>
            </div>
            {visEntries.map(e=>{
              const rl=RATING_OPTIONS.find(r=>r.value===e.rating);
              return(
                <div className="entry-row" key={e.id}>
                  <div className="entry-date">{fmtDate(e.date)}</div>
                  <span className="entry-topic" style={{background:colorForProject(e.project)}}>{e.project}</span>
                  <span className="entry-subtopic" title={e.subtopic||''}>{e.subtopic||'—'}</span>
                  <span className="entry-minutes">{e.minutes} 分</span>
                  <span className="entry-rating-short" title={rl?.label||''}>掌握 {e.rating}/5</span>
                  <span className="entry-note" title={e.note||''}>{e.note||'—'}</span>
                  <button className="del-btn" onClick={()=>setConfirmEntry(e)}>刪除</button>
                </div>
              );
            })}
          </React.Fragment>
        )}
      </div>

      <div className="daily-card">
        <div className="daily-header">
          <div className="sl-section-title">今日反思</div>
          <div className="date-nav">
            <button type="button" className="date-nav-btn" onClick={()=>shiftDate(-1)}>‹</button>
            <span className="date-nav-label">{fmtDate(selDate)}</span>
            <button type="button" className="date-nav-btn" onClick={()=>shiftDate(1)} disabled={selDate>=todayStr()}>›</button>
            {selDate!==todayStr()&&<button type="button" className="sl-link-btn" onClick={()=>setSelDate(todayStr())}>今天</button>}
          </div>
        </div>
        <textarea className="reflection-textarea" value={draftRef}
          onChange={e=>setDraftRef(e.target.value)}
          placeholder="今天過得怎麼樣？學到了什麼、卡在哪裡、有什麼想法…"/>
        <div className="daily-save-row">
          <button className="submit-btn" type="button" onClick={saveRef} disabled={refSaving||!isRefDirty}>
            {refSaving?'儲存中…':'💾 儲存反思'}
          </button>
          <span className={`daily-save-status${isRefDirty?' dirty':' saved'}`}>
            {refSaving?'同步中…':(isRefDirty?'尚未儲存':'已儲存')}
          </span>
        </div>
        {refErr&&<div className="sync-error-banner">{refErr}</div>}
      </div>

      <div className="calendar-card">
        <div className="calendar-header">
          <button type="button" className="calendar-nav-btn" onClick={()=>setCalCursor(p=>{let{year,month}=p;month--;if(month<0){month=11;year--;}return{year,month};})}>‹</button>
          <div className="calendar-month-label">{monthLabel(calCursor.year,calCursor.month)}</div>
          <button type="button" className="calendar-nav-btn" onClick={()=>setCalCursor(p=>{let{year,month}=p;month++;if(month>11){month=0;year++;}return{year,month};})}>›</button>
          <button type="button" className="sl-link-btn" onClick={()=>{const d=new Date();setCalCursor({year:d.getFullYear(),month:d.getMonth()});}}>回到本月</button>
        </div>
        <div className="calendar-weekdays">
          {['日','一','二','三','四','五','六'].map(w=><div key={w} className="calendar-weekday">{w}</div>)}
        </div>
        <div className="calendar-grid">
          {calCells.map((cell,idx)=>cell?(
            <button type="button" key={cell.dateStr}
              className={`calendar-cell${cell.dateStr===selDate?' selected':''}${cell.dateStr===todayStr()?' today':''}`}
              onClick={()=>setSelDate(cell.dateStr)}>
              <span className="calendar-daynum">{cell.day}</span>
              <span className="calendar-indicators">
                {cell.entryCount>0&&<span className="cal-dot cal-dot-entry" title={`${cell.entryCount} 筆打卡`}/>}
                {cell.hasHL&&<span className="cal-dot cal-dot-highlight" title="有 Highlight"/>}
                {cell.hasRef&&<span className="cal-dot cal-dot-reflection" title="有反思"/>}
              </span>
            </button>
          ):<div key={'b'+idx} className="calendar-cell empty"/>)}
        </div>
        <div className="calendar-detail">
          <div className="calendar-detail-title">{fmtDate(selDate)} 摘要</div>
          {selDayEntries.length===0&&!(selDayData?.highlights?.length)&&!selDayData?.reflection?(
            <div className="rating-hint">這天還沒有任何紀錄。</div>
          ):(
            <React.Fragment>
              {selDayEntries.length>0&&(
                <div className="calendar-detail-section">
                  <div className="calendar-detail-label">打卡（{selDayEntries.length}）</div>
                  {selDayEntries.map(e=>(
                    <div className="calendar-detail-entry" key={e.id}>
                      <span className="entry-topic" style={{background:colorForProject(e.project)}}>{e.project}</span>
                      <span>{e.minutes} 分</span>
                      <span className="calendar-detail-note">{e.note||e.subtopic||''}</span>
                    </div>
                  ))}
                </div>
              )}
              {selDayData?.highlights?.length>0&&(
                <div className="calendar-detail-section">
                  <div className="calendar-detail-label">Daily Highlight</div>
                  {selDayData.highlights.map(h=>(
                    <div className={`calendar-detail-highlight${h.done?' done':''}`} key={h.id}>{h.done?'✓':'○'} {h.text}</div>
                  ))}
                </div>
              )}
              {selDayData?.reflection&&(
                <div className="calendar-detail-section">
                  <div className="calendar-detail-label">反思</div>
                  <div className="calendar-detail-reflection">{selDayData.reflection}</div>
                </div>
              )}
            </React.Fragment>
          )}
        </div>
      </div>

      <div className="footer-note">資料同步至 GitHub · {config.owner}/{config.repo}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('ll-root')).render(<App/>);
  </script>
</body>
</html>
